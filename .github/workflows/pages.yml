name: deploy

# The training rig should be one tap away on a phone, which is the only place
# the cockpit can honestly be judged — and that has to be true of *every*
# branch, not just whichever one pushed last.
#
# `main` is published at the site root. Every other branch is published beside
# it under `/b/<slug>/`, and `/b/` is an index of what is currently up. A
# branch's directory is removed when the branch is, so the index cannot outlive
# the work.
#
# This publishes to the `gh-pages` branch rather than through
# `actions/deploy-pages`, because that action replaces the whole site with one
# artifact — which is exactly what used to happen here: any `claude/**` push
# silently overwrote what `main` had published. Pages source must therefore be
# **Deploy from a branch: gh-pages / (root)** in Settings -> Pages.
on:
  push:
    branches: [main, "claude/**"]
  delete:
  workflow_dispatch:

permissions:
  contents: write

# The publish is a read-modify-write of one branch, so runs must not overlap.
# Let a running one finish rather than cancelling it; skip superseded ones.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # A branch being deleted has nothing to build, and its checkout is gone.
  # Nothing here but the removal and a fresh index.
  cleanup:
    if: github.event_name == 'delete' && github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: scripts/publish.sh
          sparse-checkout-cone-mode: false

      - name: Withdraw the deleted branch
        run: scripts/publish.sh remove "${{ github.event.ref }}"
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    if: github.event_name != 'delete'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check
        run: |
          npm run lint
          npm run typecheck
          npm test

      # The driver drives the real shell in a real browser, so it needs one.
      # `vite.config.ts` prefers a pinned Chromium where an image provides one
      # and falls back to Playwright's own resolution, which is this.
      - name: Install the browser
        run: npx playwright install --with-deps chromium

      # Its own step, because it is half a minute rather than ten seconds and
      # because a failure here is a different kind of news: the suites above say
      # a unit is wrong, this one says the assembled app is.
      - name: Drive
        run: npm run drive

      # Project pages are served from /<repo>/, and a branch build one level
      # deeper again, so the bundle has to be told its own base or every asset
      # 404s. `vite.config.ts` reads BASE_PATH; nothing is hardcoded, so
      # renaming the repo cannot silently break asset paths.
      - name: Build
        run: |
          slug=$(scripts/publish.sh slug "$GITHUB_REF_NAME")
          if [ "$slug" = "." ]; then
            echo "BASE_PATH=/$REPO/" >> "$GITHUB_ENV"
          else
            echo "BASE_PATH=/$REPO/b/$slug/" >> "$GITHUB_ENV"
          fi
        env:
          REPO: ${{ github.event.repository.name }}

      - run: npm run build

      - name: Publish
        run: scripts/publish.sh put "$GITHUB_REF_NAME" dist
        env:
          GH_TOKEN: ${{ github.token }}
